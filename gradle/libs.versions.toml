[versions]
log4j = "2.26.1"
poi = "5.5.1"
flatlaf = "3.7.2"

[libraries]
txtmark = "com.github.rjeschke:txtmark:0.13"

log4j-api = { module = "org.apache.logging.log4j:log4j-api", version.ref = "log4j" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
log4j-iostreams = { module = "org.apache.logging.log4j:log4j-iostreams", version.ref = "log4j" }

rsyntaxtextarea = "com.fifesoft:rsyntaxtextarea:3.6.2"
# see studio.ui.chart.patched folder for the patch for jfreechart.
# It will require review during the jfreechart upgrade.
jfreechart = "org.jfree:jfreechart:1.5.6"

poi = { module = "org.apache.poi:poi", version.ref = "poi" }
poi-ooxml = { module = "org.apache.poi:poi-ooxml", version.ref = "poi" }

jna = "net.java.dev.jna:jna:5.19.1"
fontchooser = "org.drjekyll:fontchooser:3.1.0"
gson = "com.google.code.gson:gson:2.14.0"

flatlaf = { module = "com.formdev:flatlaf", version.ref = "flatlaf" }
flatlaf-extras = { module = "com.formdev:flatlaf-extras", version.ref = "flatlaf" }

junit-bom = "org.junit:junit-bom:6.1.3"
assertj-swing-junit = "org.assertj:assertj-swing-junit:3.17.1"

[plugins]
versions = "com.github.ben-manes.versions:0.51.0"
